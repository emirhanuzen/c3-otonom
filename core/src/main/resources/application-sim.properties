# Profile for running against the ArduPilot SITL fleet: enables the FAULT_* commands
# that change simulator parameters. Activate with --spring.profiles.active=sim.
otonom.sim.enabled=true
# OpenStreetMap zones around Elazığ. The path is relative to the project root; it is
# tried against the working directory and then its parent, so it is found both when
# IntelliJ starts the app in the project root and when ./mvnw starts it in core/.
otonom.geofence.seed-file=sim/zones/elazig-osm.geojson
# Smaller than the default 5000 m, so the simulated fleet around the airport is not
# inside the airport zone all the time.
otonom.geofence.airport-buffer-m=1000
