spring.application.name=core

# Secrets come from the .env file in the repository root. Both paths are tried,
# so the app works when started from core/ and from the root.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# PostgreSQL / PostGIS
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}?reWriteBatchedInserts=true
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Commands are published with publisher confirms and as mandatory, so an
# unroutable command is detected (see CommandPublisher).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Telemetry ingestion
otonom.telemetry.late-threshold=2s
otonom.telemetry.batch-size=100
otonom.telemetry.batch-timeout=1s
otonom.telemetry.prefetch=250

# Live drone state
otonom.live.stale-after=3s
otonom.live.lost-after=10s
otonom.live.queue-ttl=5s
otonom.live.queue-max-length=1000
otonom.live.broadcast-interval=200ms
otonom.live.max-message-age=2s
otonom.live.max-clock-skew=2s

# Alarm rules and engine
otonom.alarm.evaluation-interval=1s
otonom.alarm.clear-after=3s
otonom.alarm.battery-warning-percent=30
otonom.alarm.battery-critical-percent=15
otonom.alarm.gps-min-fix-type=3
otonom.alarm.gps-min-satellites=6
otonom.alarm.low-altitude-meters=30
otonom.alarm.low-altitude-modes=AUTO,GUIDED,RTL
otonom.alarm.airborne-margin=10

# Command channel
otonom.command.result-timeout=12s
otonom.command.confirm-timeout=5s
otonom.command.timeout-check-interval=1s

# Simulation: FAULT_* commands are rejected unless the "sim" profile turns this on
otonom.sim.enabled=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Responses are documented per endpoint with @ApiResponse; without this, every
# @ExceptionHandler of ApiExceptionHandler would be listed on every endpoint.
springdoc.override-with-generic-response=false
